name: Chrome extension download

on:
  push:
    branches: [dev]
    paths:
      - 'extension/**'
      - '.github/workflows/chrome-extension.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'extension/**'
      - '.github/workflows/chrome-extension.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package Chrome extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check extension manifest
        run: jq -e '.manifest_version == 3' extension/manifest.json
      - name: Upload installable ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nyx-chrome-extension
          path: extension/
          if-no-files-found: error
          retention-days: 30
