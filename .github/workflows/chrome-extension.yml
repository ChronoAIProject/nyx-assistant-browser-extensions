name: Chrome extension download

on:
  push:
    branches: [dev]
    paths:
      - 'extension/**'
      - 'site/**'
      - '.github/workflows/chrome-extension.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'extension/**'
      - 'site/**'
      - '.github/workflows/chrome-extension.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package Chrome extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check extension manifest
        run: jq -e '.manifest_version == 3' extension/manifest.json
      - name: Upload installable ZIP
        id: extension
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nyx-chrome-extension
          path: extension/
          if-no-files-found: error
          retention-days: 30
      - name: Retrieve the verified ZIP from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.extension.outputs.artifact-id }}
          path: ${{ runner.temp }}/extension-download
          skip-decompress: true
          digest-mismatch: error
      - name: Stage the ZIP for Pages
        run: mv "$RUNNER_TEMP"/extension-download/* site/nyx-chrome-extension.zip
      - name: Upload Pages site
        if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    name: Publish developer site
    if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency: github-pages
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
